<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo slideshow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --stage: #000000;
    --ink: #F5F5F2;
    --ink-soft: rgba(245,245,242,0.72);
    --glass: rgba(20,20,20,0.42);
    --glass-line: rgba(255,255,255,0.14);
    --page: #F3F2EE;
    --page-ink: #1E1E1C;
    --page-soft: #6B6B66;
    --drop: #D9D7D0;
    --font: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #161615; --page-ink: #EDEDE9; --page-soft: #9A9A94; --drop: #33332F;
    }
  }
  :root[data-theme="dark"] {
    --page: #161615; --page-ink: #EDEDE9; --page-soft: #9A9A94; --drop: #33332F;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%; margin: 0; background: var(--stage); color: var(--ink);
    font-family: var(--font); overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; }

  /* ---------- Stage ---------- */
  .stage { position: fixed; inset: 0; background: var(--stage); }
  .stage.idle { cursor: none; }
  .slide {
    position: absolute; inset: 0; opacity: 0;
    transition: opacity 1.4s ease;
    overflow: hidden;
  }
  .slide.on { opacity: 1; }
  .slide .wash {
    position: absolute; inset: -8%;
    background-size: cover; background-position: center;
    filter: blur(48px) saturate(1.15) brightness(0.55);
    transform: scale(1.1);
  }
  .slide .photo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain;
    transform: scale(1);
  }
  .slide.on .photo { animation: drift var(--dur, 6s) linear forwards; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.06); } }

  /* ---------- Progress ---------- */
  .progress {
    position: fixed; left: 0; right: 0; top: 0; height: 3px;
    padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box;
    z-index: 5; pointer-events: none;
  }
  .progress span {
    display: block; height: 100%; width: 0; background: rgba(255,255,255,0.85);
  }

  /* ---------- Controls ---------- */
  .bar {
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    z-index: 6; transition: opacity .5s ease, transform .5s ease;
  }
  .stage.idle ~ .bar { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
  .pill {
    display: flex; align-items: center; gap: 2px;
    padding: 6px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--glass-line);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .pill button, .pill select {
    font: inherit; color: var(--ink); background: transparent; border: 0;
    height: 40px; min-width: 40px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .pill button:hover, .pill select:hover { background: rgba(255,255,255,0.12); }
  .pill button:focus-visible, .pill select:focus-visible,
  .empty button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .pill svg { width: 20px; height: 20px; }
  .pill select { padding: 0 10px; font-size: 14px; appearance: none; -webkit-appearance: none; }
  .pill select option { color: #111; }
  .count { font-size: 14px; color: var(--ink-soft); padding: 0 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sep { width: 1px; height: 22px; background: var(--glass-line); margin: 0 4px; }

  /* ---------- Empty state ---------- */
  .empty {
    position: fixed; inset: 0; z-index: 10;
    background: var(--page); color: var(--page-ink);
    display: grid; place-items: center; padding: 24px;
  }
  .empty[hidden] { display: none; }
  .drop {
    width: min(560px, 100%); aspect-ratio: 4 / 3;
    border: 1px solid var(--drop); border-radius: 28px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 32px;
    transition: border-color .2s, background .2s;
  }
    .drop h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 500; letter-spacing: -0.01em; margin: 0; line-height: 1.15; }
  .drop p { margin: 0; color: var(--page-soft); font-size: 16px; line-height: 1.5; max-width: 36ch; }
  .drop .status { font-size: 14px; color: var(--page-soft); min-height: 1.5em; }
  .drop button[hidden] { display: none; }
  .drop button {
    font: inherit; font-weight: 600; font-size: 16px;
    background: var(--page-ink); color: var(--page);
    border: 0; border-radius: 999px; padding: 14px 26px; cursor: pointer;
  }

  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 20px);
    transform: translateX(-50%); z-index: 20;
    background: var(--glass); border: 1px solid var(--glass-line); color: var(--ink);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 10px 18px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 520px) {
    .hide-sm { display: none !important; }
    .pill button, .pill select { height: 44px; min-width: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition: opacity .3s linear; }
    .slide.on .photo { animation: none; }
  }
</style>
</head>
<body>

<div class="stage" id="stage" aria-live="polite" aria-roledescription="slideshow"></div>
<div class="progress" aria-hidden="true"><span id="prog"></span></div>

<div class="bar" id="bar">
  <div class="pill" role="toolbar" aria-label="Slideshow controls">
    <button id="prev" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="play" aria-label="Pause">
      <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
    </button>
    <button id="next" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <span class="count" id="count">0 of 0</span>
    <span class="sep hide-sm"></span>
    <select id="speed" class="hide-sm" aria-label="Time per photo">
      <option value="3">3 sec</option>
      <option value="5" selected>5 sec</option>
      <option value="8">8 sec</option>
      <option value="12">12 sec</option>
    </select>
    <button id="full" aria-label="Full screen" title="Full screen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<p id="msg" style="position:fixed;inset:0;display:grid;place-items:center;margin:0;padding:24px;text-align:center;color:var(--ink-soft);font-size:16px;">Loading photos</p>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), prog = $('prog'), count = $('count'), msg = $('msg');
  let photos = [], updated = null;
  let idx = 0, playing = true, seconds = 5, raf = null, startedAt = 0, elapsed = 0;

  try {
    const saved = parseInt(localStorage.getItem('slideshow-speed'), 10);
    if ([3,5,8,12].includes(saved)) { seconds = saved; $('speed').value = String(saved); }
  } catch (e) {}

  function makeSlide(src) {
    const s = document.createElement('div');
    s.className = 'slide';
    s.style.setProperty('--dur', (seconds + 1.4) + 's');
    const wash = document.createElement('div');
    wash.className = 'wash';
    wash.style.backgroundImage = `url("${src}")`;
    const img = document.createElement('img');
    img.className = 'photo'; img.src = src; img.alt = '';
    s.append(wash, img);
    return s;
  }
  function show(i) {
    if (!photos.length) return;
    idx = (i + photos.length) % photos.length;
    const next = makeSlide(photos[idx]);
    stage.appendChild(next);
    requestAnimationFrame(() => requestAnimationFrame(() => next.classList.add('on')));
    const old = [...stage.children].slice(0, -1);
    setTimeout(() => old.forEach(o => o.remove()), 1600);
    count.textContent = `${idx + 1} of ${photos.length}`;
    if (photos.length > 1) { const p = new Image(); p.src = photos[(idx + 1) % photos.length]; }
    restartClock();
  }
  function restartClock() {
    cancelAnimationFrame(raf); elapsed = 0; prog.style.width = '0';
    if (playing && photos.length > 1) tick();
  }
  function tick() {
    startedAt = performance.now() - elapsed;
    const total = seconds * 1000;
    const step = now => {
      elapsed = now - startedAt;
      prog.style.width = Math.min(100, (elapsed / total) * 100) + '%';
      if (elapsed >= total) { show(idx + 1); return; }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  function setPlaying(p) {
    playing = p;
    $('icoPause').style.display = p ? '' : 'none';
    $('icoPlay').style.display = p ? 'none' : '';
    $('play').setAttribute('aria-label', p ? 'Pause' : 'Play');
    stage.querySelectorAll('.slide.on .photo').forEach(img => { img.style.animationPlayState = p ? 'running' : 'paused'; });
    if (p && photos.length > 1) tick(); else cancelAnimationFrame(raf);
  }
  function toast(text) {
    const t = $('toast'); t.textContent = text; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200);
  }

  // Load the photo list. Checks again every 30 minutes, so a screen left
  // open picks up new photos after the daily rebuild without reloading.
  async function load() {
    try {
      const r = await fetch('photos.json', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      if (data.updated === updated) return;
      const first = updated === null;
      updated = data.updated;
      const v = encodeURIComponent(updated);
      photos = (data.photos || []).map(p => `${p}?v=${v}`);
      if (!photos.length) { msg.textContent = 'There are no photos in the slideshow yet.'; return; }
      msg.remove();
      if (first) show(0); else { toast('New photos added'); show(0); }
    } catch (e) {
      if (updated === null) msg.textContent = 'The photos couldn\u2019t be loaded. Check your connection and reload the page.';
    }
  }

  $('prev').onclick = () => show(idx - 1);
  $('next').onclick = () => show(idx + 1);
  $('play').onclick = () => setPlaying(!playing);
  $('speed').onchange = e => {
    seconds = parseInt(e.target.value, 10);
    try { localStorage.setItem('slideshow-speed', String(seconds)); } catch (err) {}
    restartClock();
  };
  $('full').onclick = async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (e) { toast('Full screen isn\u2019t available in this browser.'); }
  };
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || !photos.length) return;
    if (e.key === 'ArrowRight') show(idx + 1);
    else if (e.key === 'ArrowLeft') show(idx - 1);
    else if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
    else if (e.key.toLowerCase() === 'f') $('full').click();
    wake();
  });
  let sx = null;
  stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 40) show(idx + (dx < 0 ? 1 : -1)); else wake();
  });
  let idleT;
  function wake() {
    stage.classList.remove('idle'); clearTimeout(idleT);
    idleT = setTimeout(() => { if (photos.length) stage.classList.add('idle'); }, 2500);
  }
  ['mousemove','pointerdown','touchstart'].forEach(ev => document.addEventListener(ev, wake, { passive: true }));
  $('bar').addEventListener('focusin', () => { clearTimeout(idleT); stage.classList.remove('idle'); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(raf); else if (playing && photos.length > 1) tick();
  });

  load(); wake();
  setInterval(load, 30 * 60 * 1000);
})();
</script>
</body>
</html>
